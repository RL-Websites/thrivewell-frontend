<!--
  Layout parity: thrivewellrx SiteHeader — full-width bar, subtle border, CTA row.
  Nav + routes unchanged.
-->
<header class="site-header bg-white border-bottom w-100">
  <div class="tw-section-container py-3 py-md-4">
    <nav
      class="navbar navbar-expand-md p-0 align-items-center"
      data-aos="fade-down"
      data-aos-duration="800"
    >
      <a
        [routerLink]="''"
        class="navbar-brand me-auto me-md-3 py-0"
        aria-label="Thrivewell home"
      >
        <img src="images/thrivewell-logo.svg" alt="" width="160" height="40" />
      </a>

      <button
        class="navbar-toggler border-0 ms-2"
        type="button"
        aria-controls="navbarColor03"
        [attr.aria-expanded]="!isCollapsed"
        aria-label="Toggle navigation"
        (click)="toggleNavbar()"
      >
        <i
          [ngClass]="{
            'icon-hamburger': isCollapsed,
            'icon-close': !isCollapsed,
          }"
        ></i>
      </button>

      <div
        class="collapse navbar-collapse flex-grow-0"
        id="navbarColor03"
        [ngbCollapse]="isCollapsed"
      >
        <div
          class="d-flex flex-column flex-md-row align-items-stretch align-items-md-center gap-md-4 gap-3 ms-md-auto w-100 w-md-auto pt-3 pt-md-0"
        >
          <ul
            class="navbar-nav d-md-flex flex-row flex-wrap justify-content-md-end gap-md-3 gap-2 mb-0"
          >
            <li class="nav-item list-unstyled">
              <a
                [routerLink]="'/about'"
                routerLinkActive="active"
                class="nav-link text-dark fw-medium px-0"
                >About</a
              >
            </li>
            <li class="nav-item list-unstyled">
              <a
                [routerLink]="'/solutions'"
                routerLinkActive="active"
                class="nav-link text-dark fw-medium px-0"
                >Solutions</a
              >
            </li>
            <li class="nav-item list-unstyled">
              <a
                [routerLink]="'/legitscript'"
                routerLinkActive="active"
                class="nav-link text-dark fw-medium px-0"
                >LegitScript</a
              >
            </li>
            <li class="nav-item list-unstyled">
              <a
                [routerLink]="'/faq'"
                routerLinkActive="active"
                class="nav-link text-dark fw-medium px-0"
                >FAQ</a
              >
            </li>
          </ul>
          <div
            class="d-flex flex-column flex-sm-row align-items-sm-center gap-2 gap-sm-3"
          >
            <a [routerLink]="'/book-now'" class="btn-cta text-center">Book Now</a>
            <a
              href="tel:+19728437272"
              class="site-header__phone d-flex align-items-center justify-content-center justify-content-md-end text-decoration-none"
            >
              <span
                class="site-header__phone-label text-uppercase fw-semibold text-dark small mb-0 me-sm-2"
                >Get your demo today!</span
              >
              <span class="text-primary fw-semibold text-nowrap"
                >1 (972) 843-7272</span
              >
            </a>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>
